name: release

# 推送时启动；只有提交标题形如 `chore: release 1.2.3` 才真正走发布流程。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "手动发布时的版本号（如 1.2.3）"
        required: false

permissions:
  contents: write

jobs:
  guard:
    name: 判断是否为发布提交
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          echo "最近一次提交：$subject"

          version=""
          if [[ "$subject" =~ ^chore:\ release\ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          fi

          if [[ -n "$version" ]]; then
            echo "release=true"  >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "将发布 v$version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "不是发布提交，跳过发布"
          fi

  build:
    name: 编译 ${{ matrix.target }}
    needs: guard
    if: needs.guard.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tigerium-x86_64-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tigerium-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译
        run: cargo build --release

      - name: 打包（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd target/release
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.artifact }}" tigerium

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/tigerium.exe -DestinationPath "$env:GITHUB_WORKSPACE/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: 发布
    needs: [guard, build]
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          notes="Tigerium v${VERSION}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber
          else
            gh release create "v${VERSION}" dist/* \
              --title "v${VERSION}" \
              --notes "$notes" \
              --target "${GITHUB_SHA}"
          fi
