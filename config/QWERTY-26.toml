# ============================================================
# 示例配置：QWERTY 26 键（禁用主行第 10 键与下排后三键）
# 用法：
#   tigerium optimize --config config/QWERTY-26.toml --steps 300000 --seed 1 --out out
#
#
# 26 键 = 把主行第 10 键（;）与下排后三键（, . /）的键费置 0 禁用；
# 这样键位几何与标准 QWERTY 26 字母完全一致，便于和别的 26 键方案同口径比较。
# 本文件只放**算法参数**；数据源路径见文末 [data] 段。
# 换成别的方案时，复制本文件改 [data] 与（如需要）[keyboard]/[alphabet] 即可。
# ============================================================

# ---------------- 键盘：按键费 ----------------
# 3 行 × 10 列的按键费。数值是「一次按键的费用」，越贵越差。
# 值 ≤ 0 表示**禁用该键**（留给标点、或单手布局留空）：不会再有字根落上去。
# 下面这组是「行基准 × 小幅列系数」：主行 0.9、上下排 1.0，内列再贵 5%~10%。
[keyboard]
row0 = [1.1, 1.05, 1.0, 0.965, 1.015, 1.015, 0.965, 1.0, 1.05, 1.1]
row1 = [0.99, 0.945, 0.9, 0.868, 0.919, 0.919, 0.868, 0.9, 0.945, 0.0]
row2 = [1.1, 1.05, 1.0, 0.965, 1.065, 1.065, 0.965, 0.0, 0.0, 0.0]
# 单根字可用的无理码尾（可给多个符号，退火会按代价挑哪个更划算）
wuli = [14, 15]

# ---------------- 候选上限 ----------------
# 一简 / 二简 / 三简 / 四码 各允许几个候选；逻辑全码（最长码）不受此限，按 9 计。
# 想「零选重」就把短码层都设成 1。
[candidates]
caps = [1, 1, 1, 9]

# ---------------- 选重罚 ----------------
# 有重码时按「惊讶度」折算：base(rank) × (1 − 本字权重 / 同码总权)。
# 首选 / 二选三选 / 之后每后移几位 / 每次加多少
[selection]
p1 = 0.5
p2 = 4.5
sel_span = 2.0
sel_step = 2.0

# ---------------- 编码细节 ----------------
[code]
# 四根及以上字的末位：用末根的小码 true，用大码 false
last_small = false
# 单根字的筛重码（三选一，同一布局与同一权重下的实测对照）：
#           费用      击键      疲劳      码长     互击     小指
#   wuli   1.9716    1.9831   -0.0126   1.9831   65.9%    9.5%
#   aaa    1.9746    1.9786   -0.0051   1.9786   65.9%   10.3%
#   aaaa   1.9797    1.9869   -0.0080   1.9869   65.1%   10.0%
#   "wuli" —— Aa(Aax)：第三码从 keyboard.wuli 给的符号里挑，只用于单根字筛重
#   "aaa"  —— Aa(Aaa)：第三码复用**小码**（大小小）
#   "aaaa" —— Aa(AaAa)：重复整条全码（大小大小）
single_root = "wuli"

# ---------------- 训练约束 ----------------
[training]
# 参与重排的权重下限（低于它的字只按逻辑全码落表）
min_weight = 1.0
# 简码资格：1 = 只有一级字，2 = 一二级，3 = 一二三级
short_levels = 1
# 第一层软约束：前 top_n 个高频字的码长不得超过 top_len，否则按字频罚 top_pen
top_n = 30
top_len = 1
top_pen = 1.0
# 第二层软约束：前 top_n2 个高频字的码长不得超过 top_len2（0 = 关闭）
top_n2 = 0
top_len2 = 2
top_pen2 = 0.6

# ---------------- 人体工学 ----------------
# 疲劳值的权重：总费用 = 击键费 + 选重费 + fatigue_weight × 疲劳值。
# 设 0 就只比击键与选重（得到「理论最优」），再逐档上调给人体工学让路。
[cost]
fatigue_weight = 1.0

# 相邻两键的疲劳权重（互击是奖励，其余是罚）
[ergo]
alt = 0.09          # 左右互击
same_big = 1.6      # 同指、行距 ≥ 2
same_small = 0.5    # 同指、行距 = 1
pinky = 0.25        # 相邻两键里有小指
wrong = 0.7         # 同手，从中/无名指中下排跳上上排
triple = 0.25       # 三连击：只统计，不计价

# ---------------- 退火 ----------------
[search]
# 六类移动的权重：换大码 / 改大码 / 换小码 / 改小码 / 整格换 / 整键换
moves = [3.0, 2.0, 2.0, 1.0, 1.0, 1.0]
t0 = 0.004          # 起始温度（越大越乱；从已有布局继续时调小）
t1 = 0.00001        # 终止温度
steps = 400000      # 每轮步数
rounds = 1          # 重升温轮数（每轮从上一轮最优出发）
seed = 1

# ---------------- 字母表 ----------------
# 30 个键的显示字符，与 [keyboard] 的三行一一对应。
# 可以是字母、数字、汉字——Rime 支持非 ASCII 编码。
# 留空串 '' 或字符重复 = 该键禁用。
[alphabet]
row0 = ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p']
row1 = ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';']
row2 = ['z', 'x', 'c', 'v', 'b', 'n', 'm', ',', '.', '/']

# ---------------- 数据源 ----------------
# 换成别的方案只改这一段。格式见 profiles/README.md。
[data]
roots = "data/roots.tsv"
splits = "data/拆分方案.txt"
weights = "data/原码编码.yaml"
nfkc = "data/nfkc.tsv"
forced = "data/forced.tsv"
level1 = "std/level-1.txt"
level2 = "std/level-2.txt"
level3 = "std/level-3.txt"
